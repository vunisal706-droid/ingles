<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitulín English Adventure</title>
<meta name="theme-color" content="#3d8bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="LOGO.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#dff3ff;--bg2:#fff4d6;--bg3:#e7ffe9;
  --acc:#3d8bff;--acc-d:#2563c9;--acc2:#ffb703;
  --ink:#24324a;--muted:#5d6b85;--card:#ffffff;
  --ok:#16a34a;--ok-bg:#dcfce7;--bad:#dc2626;--bad-bg:#fee2e2;
  --font:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
}
body.halloween{--bg1:#f3e3ff;--bg2:#ffe3c7;--bg3:#fff6d9;--acc:#f07d1a;--acc-d:#c45e0b;--acc2:#9b5de5;}
body.christmas{--bg1:#e3f2ff;--bg2:#ffe6e6;--bg3:#e6ffef;--acc:#e63946;--acc-d:#b5202d;--acc2:#2a9d5c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--font);color:var(--ink);overflow:hidden;
  background:linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:400% 400%;
  animation:bgmove 20s ease infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#deco span{position:absolute;top:-60px;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#app{position:relative;z-index:1;height:100%}
.screen{display:none;flex-direction:column;height:100%;padding:12px 16px;gap:12px;overflow-y:auto}
.screen.active{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{font-family:var(--font);cursor:pointer;border:none;color:var(--ink)}
.btn{background:#fff;border-radius:16px;padding:10px 18px;font-size:1.15rem;font-weight:700;min-height:52px;
  box-shadow:0 5px 0 rgba(0,0,0,.12),0 8px 14px rgba(0,0,0,.08);transition:transform .08s,box-shadow .08s}
.btn:active,.cbtn:active,.mode:active,.card:active,.stage:active,.lvl:active,.bbtn:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-d),0 8px 14px rgba(0,0,0,.1)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.pill{background:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.top{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px;flex-wrap:wrap;text-align:center}
.logo{height:92px;width:auto;border-radius:16px;background:#fff;padding:6px;box-shadow:0 6px 16px rgba(0,0,0,.08)}
h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1;color:var(--acc-d)}
h1 span{display:block;color:var(--acc2);font-size:.7em}
.sub{margin:4px 0 0;color:var(--muted);font-weight:700}
h2{margin:0;font-size:1.5rem}
.panel{background:rgba(255,255,255,.8);border-radius:24px;padding:14px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.05)}
.panel h2{margin-bottom:10px}
.lvl{background:#fff;border-radius:16px;padding:10px 20px;font-size:1.2rem;font-weight:800;min-height:56px;
  box-shadow:0 5px 0 rgba(0,0,0,.12);border:3px solid transparent}
.lvl.on{border-color:var(--acc);background:#fff;color:var(--acc-d)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1100px;width:100%;margin:0 auto}
.mode{border-radius:28px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 8px 0 rgba(0,0,0,.14),0 12px 20px rgba(0,0,0,.08);min-height:170px;justify-content:center}
.mode span{font-size:4rem;line-height:1.1}.mode b{font-size:1.6rem}.mode small{font-size:1rem;color:var(--muted);font-weight:700}
.m-normal{background:linear-gradient(160deg,#d8f0ff,#fff)}.m-hall{background:linear-gradient(160deg,#ffe0c2,#f3e3ff)}.m-xmas{background:linear-gradient(160deg,#ffdede,#e2ffe9)}.m-class{background:linear-gradient(160deg,#fff3c4,#dff3ff);border:4px dashed #f59e0b}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar h2{flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding-bottom:20px}
.card{background:#fff;border-radius:24px;padding:14px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;gap:2px}
.card .ic{font-size:3.2rem;line-height:1.2}.card b{font-size:1.25rem}.card small{color:var(--muted);font-weight:700}
.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:820px;width:100%;margin:auto}
.stage{background:#fff;border-radius:28px;padding:18px;display:flex;align-items:center;gap:16px;text-align:left;min-height:120px;box-shadow:0 7px 0 rgba(0,0,0,.12)}
.stage .ic{font-size:3.4rem}.stage b{display:block;font-size:1.5rem}.stage small{font-size:1.05rem;color:var(--muted);font-weight:700}
.stage .cr{font-size:1.2rem}
.dim{opacity:.22;filter:grayscale(1)}
.lgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.lcard{min-height:150px;justify-content:center}
.lcard .pic{font-size:3.6rem;line-height:1.1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.lcard .num{font-size:3.2rem;font-weight:800;color:var(--acc-d);line-height:1.1}
.sw{width:70px;height:70px;border-radius:50%;border:4px solid #d6dbe6}
.lcard b{font-size:1.4rem}
.lcard.on{animation:pulse .6s ease;outline:4px solid var(--acc)}
@keyframes pulse{50%{transform:scale(1.08)}}
#game{padding:8px 12px;gap:8px;overflow:hidden}
.hud #hearts{font-size:1.7rem;letter-spacing:2px}
#promptBar{display:flex;align-items:center;justify-content:center;gap:14px;min-height:60px}
#promptText{font-size:1.9rem;font-weight:800;background:#fff;border-radius:18px;padding:4px 22px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
#promptText small{font-size:1rem;color:var(--muted)}
.big{font-size:1.8rem;min-width:66px;min-height:60px}
.cvwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#cv{width:100%;max-width:calc((100vh - 230px)*16/9);aspect-ratio:16/9;height:auto;border-radius:24px;
  box-shadow:0 10px 0 rgba(0,0,0,.08),0 14px 30px rgba(0,0,0,.1);background:#fff;touch-action:none}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ctrl>div:first-child{display:flex;gap:10px}
.cbtn{width:72px;height:64px;border-radius:18px;background:#fff;font-size:1.8rem;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.hint{color:var(--muted);font-weight:700;text-align:center}
.bossctrl{display:none;flex-wrap:wrap;gap:10px;justify-content:center}
.bbtn{background:#fff;border-radius:18px;min-width:110px;min-height:72px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;
  font-size:1rem;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.bbtn:disabled{opacity:.45}.bbtn span{font-size:1.9rem;line-height:1.1}
.modal{position:fixed;inset:0;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:30px;padding:24px 28px;text-align:center;max-width:560px;width:100%;box-shadow:0 12px 0 rgba(0,0,0,.08),0 20px 50px rgba(0,0,0,.15);animation:fadeIn .25s}
.mbox h2{font-size:2.2rem}.crowns{font-size:3.2rem;margin:6px 0}.mbox p{font-size:1.3rem;font-weight:700;margin:8px 0 16px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}
.shop button{background:#f6f8fc;border-radius:18px;padding:10px;font-weight:800;font-size:1rem;border:3px solid transparent}
.shop button.on{border-color:var(--acc)}.shop button span{display:block;font-size:2.4rem;min-height:48px}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:.95rem;margin-top:10px}
.classbtn{grid-column:1/-1;background:linear-gradient(120deg,#fff,#fff7d6);border:4px dashed var(--acc)}
.cbody{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.cmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;align-content:center;flex:1}
.cmenu .stage{flex-direction:column;text-align:center;justify-content:center;min-height:200px}
.cmenu .stage .ic{font-size:4.2rem}
.cprompt{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.ptxt{font-size:clamp(1.6rem,3.4vw,2.8rem);font-weight:800;background:#fff;border-radius:22px;padding:6px 26px;box-shadow:0 5px 0 rgba(0,0,0,.08);text-align:center;line-height:1.15}
.ptxt small{display:block;font-size:.45em;color:var(--muted)}
.cards4{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;min-height:0;padding:8px}
.c4{position:relative;background:#fff;border:10px solid var(--cc,#cbd5e1);border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;box-shadow:0 8px 0 rgba(0,0,0,.1);transition:transform .25s,opacity .25s,box-shadow .25s}
.c4 .pic{font-size:clamp(3.5rem,9vw,8rem);line-height:1.1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.c4 .num{font-size:clamp(3.5rem,8vw,7rem);font-weight:800;color:var(--acc-d);line-height:1.1}
.c4 .sw{width:clamp(70px,10vw,140px);height:clamp(70px,10vw,140px)}
.c4 b{font-size:clamp(1.2rem,2.4vw,2.1rem);text-align:center}
.badge{position:absolute;top:-14px;left:-14px;width:66px;height:66px;border-radius:50%;background:var(--cc);color:#fff;font-size:2rem;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.c4.ok{transform:scale(1.05);box-shadow:0 0 0 10px #16a34a,0 10px 0 rgba(0,0,0,.1)}
.c4.off{opacity:.2}
.c4.hl{box-shadow:0 0 0 8px var(--acc);transform:scale(1.04)}
.big2{font-size:1.5rem;min-height:70px;padding:10px 30px}
.okb{background:var(--ok-bg);color:var(--ok)}.kob{background:var(--bad-bg);color:var(--bad)}
.csetup{max-width:720px;margin:auto;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.csetup p{margin:0;font-weight:700;font-size:1.2rem}
.csetup textarea{width:100%;font-family:var(--font);font-size:1.2rem;border-radius:16px;border:3px solid #dbe3ef;padding:10px}
.track{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.75);border-radius:20px;padding:8px 10px}
.trow{display:flex;align-items:center;gap:10px;border-radius:14px;padding:2px 6px}
.trow.cur{background:#fff;box-shadow:0 0 0 3px var(--acc)}
.tname{width:170px;font-weight:800;font-size:1.3rem;flex:none}
.cells{flex:1;display:flex;gap:4px}
.cell{flex:1;height:42px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;font-size:1.7rem}
.cell.fin{background:#fff;flex:0 0 48px}
.tq{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
.tturn{color:#fff;font-size:2rem;font-weight:800;border-radius:999px;padding:4px 28px}
.tpics{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.tpics .c4{width:clamp(150px,18vw,240px);aspect-ratio:1}
.c4.one{width:clamp(200px,24vw,300px);aspect-ratio:1}
.mwrap{position:relative;flex:1;display:flex;min-height:0}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px;align-content:center;padding:8px}
.mgrid .c4{min-height:150px}
.q{font-size:5rem}
.curtain{position:absolute;inset:0;background:linear-gradient(160deg,#fde68a,#fbcfe8,#bae6fd);border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:2;animation:fadeIn .3s}
.curtain svg,.wside svg,.sicon svg{height:clamp(150px,30vh,280px);width:auto}
.simon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.srow{display:flex;align-items:center;justify-content:center;gap:clamp(20px,8vw,120px)}
.sboss{font-size:clamp(7rem,20vw,14rem);line-height:1;animation:pulse 2.4s infinite}
.sicon{font-size:clamp(7rem,18vw,13rem);line-height:1;min-width:1.2em;text-align:center}
.sbub{background:#fff;border:6px solid var(--acc);border-radius:30px;padding:12px 34px;font-size:clamp(2rem,5vw,4rem);font-weight:800;text-align:center;line-height:1.15}
.sbub small{display:block;font-size:.5em;color:var(--muted)}
.sbub.bad{border-color:var(--bad);background:var(--bad-bg);color:#b91c1c}
.wheelwrap{flex:1;display:flex;gap:30px;align-items:center;justify-content:center;min-height:0;flex-wrap:wrap}
.wcol{position:relative}
#wc{width:min(460px,58vh);height:auto;aspect-ratio:1;display:block;filter:drop-shadow(0 8px 0 rgba(0,0,0,.08))}
.wptr{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:3rem;color:#dc2626;z-index:2}
.wside{flex:1;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rank{font-size:1.4rem;font-weight:800;display:flex;flex-direction:column;gap:4px;margin:10px 0 16px;max-height:55vh;overflow:auto}
.bigwin{font-size:7rem;animation:pulse 1s infinite}
@media (max-width:900px){.cards4{grid-template-columns:repeat(2,1fr)}.tname{width:auto}}
@media (max-width:900px){.modes{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.modes{grid-template-columns:1fr}.mode{min-height:120px}.stages{grid-template-columns:1fr}.hint{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="deco"></div>
<div id="app">

<section id="home" class="screen active">
  <header class="top">
    <img src="LOGO.jpg" class="logo" alt="CEIP Capitulaciones" width="92" height="92" onerror="this.style.display='none'">
    <div><h1>Capitulín <span>English Adventure</span></h1><p class="sub">Listen · Jump · Spell · Play!</p></div>
  </header>
  <div class="panel"><h2>¿Qué curso?</h2><div id="levels" class="row"></div></div>
  <div class="modes">
    <button class="mode m-normal" data-mode="normal"><span>🌍</span><b>Adventure</b><small id="cntN"></small></button>
    <button class="mode m-hall" data-mode="halloween"><span>🎃</span><b>Halloween</b><small id="cntH"></small></button>
    <button class="mode m-xmas" data-mode="christmas"><span>🎄</span><b>Christmas</b><small id="cntC"></small></button>
    <button class="mode m-class" id="classHome"><span>🏫</span><b>Modo clase</b><small>Pizarra digital</small></button>
  </div>
  <div class="row">
    <div class="pill">⭐ <span class="starCount">0</span></div>
    <button class="btn" id="shopBtn">🛍️ Tienda</button>
    <button class="btn" id="soundBtn" aria-label="Sonido">🔊</button>
    <button class="btn" id="fsBtn" aria-label="Pantalla completa">⛶</button>
  </div>
</section>

<section id="map" class="screen">
  <div class="bar"><button class="btn" data-go="home" aria-label="Volver">⬅</button><h2 id="mapTitle"></h2><div class="pill">⭐ <span class="starCount">0</span></div></div>
  <div id="mapGrid" class="grid"></div>
</section>

<section id="world" class="screen">
  <div class="bar"><button class="btn" data-go="map" aria-label="Volver">⬅</button><h2 id="worldTitle"></h2><div class="pill">⭐ <span class="starCount">0</span></div></div>
  <div id="stages" class="stages"></div>
</section>

<section id="learn" class="screen">
  <div class="bar"><button class="btn" data-go="world" aria-label="Volver">⬅</button><h2 id="learnTitle"></h2><button class="btn pri" id="playAll">🔊 All</button></div>
  <div id="learnGrid" class="grid lgrid"></div>
</section>

<section id="game" class="screen">
  <div class="bar hud"><button class="btn" id="quitBtn" aria-label="Salir">✖</button><div id="hearts"></div><div id="prog" class="pill"></div><div class="pill">⭐ <span id="gStars">0</span></div></div>
  <div id="promptBar"><button id="sayBtn" class="btn big" aria-label="Escuchar otra vez">🔊</button><div id="promptText"></div></div>
  <div class="cvwrap"><canvas id="cv" width="960" height="540"></canvas></div>
  <div id="ctrl" class="ctrl">
    <div><button class="cbtn" id="cL" aria-label="Izquierda">◀</button><button class="cbtn" id="cR" aria-label="Derecha">▶</button></div>
    <div class="hint">Toca la imagen · o usa ← → y espacio</div>
    <button class="cbtn" id="cJ" aria-label="Saltar">⬆</button>
  </div>
  <div id="bossCtrl" class="bossctrl"></div>
</section>

<section id="class" class="screen">
  <div class="bar"><button class="btn" id="classBack" aria-label="Volver">⬅</button><h2 id="classTitle"></h2><button class="btn" id="classFs" aria-label="Pantalla completa">⛶</button></div>
  <div id="classBody" class="cbody"></div>
</section>
</div>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>

<script>
/* ================== DATOS ================== */
const NUMW=['one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const NUMSTR=NUMW.map((w,i)=>'@'+(i+1)+' '+w).join('|')+'|@30 thirty|@40 forty|@50 fifty|@60 sixty|@70 seventy|@80 eighty|@90 ninety|@100 one hundred';

const MODES={
 normal:{name:'Adventure',boss:{e:'🧙‍♀️',name:'Witch Wanda'},extra:[],worlds:[
  {id:'colours',icon:'🎨',name:'Colours',words:'#e53935 red|#1e88e5 blue|#fdd835 yellow|#43a047 green|#fb8c00 orange|#8e24aa purple|#f48fb1 pink|#795548 brown|#212121 black|#ffffff white|#9e9e9e grey|#d4af37 gold'},
  {id:'numbers',icon:'🔢',name:'Numbers',words:NUMSTR},
  {id:'pets',icon:'🐶',name:'Pets & Farm',words:'🐶 dog|🐱 cat|🐴 horse|🐮 cow|🐷 pig|🐑 sheep|🦆 duck|🐔 chicken|🐰 rabbit|🐭 mouse|🐐 goat|🐹 hamster|🐟 fish|🐦 bird|🐢 tortoise|🐸 frog|🐝 bee|🐌 snail|🐜 ant|🦋 butterfly|🐞 ladybird|🐛 caterpillar'},
  {id:'wild',icon:'🦁',name:'Wild Animals',words:'🦁 lion|🐯 tiger|🐘 elephant|🐵 monkey|🦒 giraffe|🦓 zebra|🐻 bear|🐍 snake|🐊 crocodile|🦘 kangaroo|🐫 camel|🐧 penguin|🐬 dolphin|🐳 whale|🦈 shark|🦉 owl|🦊 fox|🐺 wolf|🐼 panda|🐨 koala|🦛 hippo|🦜 parrot|🐙 octopus|🦀 crab|🦏 rhino|🦇 bat|🐿️ squirrel|🦔 hedgehog'},

function listenRound(){const L=LV(),tgt=G.queue[G.round];
 const pool=shuffle(G.words.filter(w=>w.w!==tgt.w&&w.pic!==tgt.pic)).slice(0,L.opts-1);const opts=shuffle([tgt,...pool]);const n=opts.length;
 const x0=n===3?300:250,x1=n===3?780:830,w=n===3?160:140;
 G.plats=opts.map((o,i)=>({opt:o,x:n>1?x0+(x1-x0)*i/(n-1):540,y:i%2?255:290,w,h:100,shake:0}));
 G.target=tgt;G.locked=false;setPrompt();updHud();speakPrompt();}
function judgeListen(p){const P=G.P;
 if(p.opt===G.target){p.good=true;G.locked=true;G.correct++;G.earned++;sfx('good');burst(p.x,p.y,30);say(rand(PRAISE)+' '+G.target.w+'!');updHud();const id=G.id;
  setTimeout(()=>{if(!alive(id))return;G.round++;if(G.round>=G.total)return finish(true);G.plats.forEach(q=>q.gone=true);hopTo(90,GY,120,650,()=>{P.standing=null;listenRound();});},1500);}
 else{p.disabled=true;p.shake=24;G.errors++;P.standing=null;P.onGround=false;say('Oops! Try again!');loseHeart();}}
function landed(p){if(G.stage==='listen'&&p.opt&&!G.locked&&!p.disabled)judgeListen(p);}

/* --- Spell it --- */
function spellRound(){const L=LV(),word=G.queue[G.round],letters=word.w.toLowerCase().split('');
 const alpha=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!letters.includes(c))).slice(0,L.distract);
 const all=shuffle([...letters,...alpha]),n=all.length,two=n>8;
 G.plats=all.map((c,i)=>({letter:c,x:n>1?130+(850-130)*i/(n-1):480,y:two?(i%2?222:300):300,w:58,h:58,shake:0}));
 G.target=word;G.pos=0;G.locked=false;G.P.standing=null;G.P.onGround=false;setPrompt();updHud();say(word.w,L.rate*.9);}
function hitBlock(b){if(b.used||G.locked)return;const word=G.target.w.toLowerCase();
 if(b.letter===word[G.pos]){b.used=true;b.pop=0;G.pos++;sfx('coin');burst(b.x,b.y+29,8);
  if(G.pos>=word.length){G.locked=true;G.correct++;G.earned+=2;sfx('good');burst(480,90,40);say(rand(PRAISE)+' '+G.target.w+'!');updHud();const id=G.id;
   setTimeout(()=>{if(!alive(id))return;G.round++;if(G.round>=G.total)return finish(true);spellRound();},1700);}}
 else{b.shake=24;G.errors++;say('Oops!');loseHeart();}}

/* --- Boss: Simon Says --- */
function availCmds(){const L=LV();let c=CMDS.slice(0,L.cmds);if(L.cmds>4)c=c.concat(MD().extra);return c;}
function buildBossBtns(){const c=$('#bossCtrl');c.innerHTML='';availCmds().forEach(cm=>{const b=document.createElement('button');b.className='bbtn';
 b.innerHTML=`<span>${cm.icon}</span>${cm.en.replace('!','')}`;b.onclick=()=>bossAnswer(cm.id);c.appendChild(b);});
 if(LV().simon){const b=document.createElement('button');b.className='bbtn';b.innerHTML='<span>🤫</span>Quieto';b.onclick=()=>bossAnswer(null);c.appendChild(b);}}
function setBtns(on){document.querySelectorAll('.bbtn').forEach(b=>b.disabled=!on);}
function bossTurn(){if(!G||!G.running)return;const L=LV(),c=rand(availCmds()),says=L.simon?Math.random()<.68:true;
 G.cmd=c;G.says=says;G.fb=null;G.tMax=L.time;G.tLeft=L.time;G.turn=true;G.timing=false;setBtns(true);
 const tid=G.id;let started=false;const go=()=>{if(started||!alive(tid))return;started=true;G.timing=true;};setTimeout(go,4000);G.lastTxt=(L.simon&&says?'Simon says, ':'')+c.en;
 G.bubble=(L.simon&&says?'Simon says: ':'')+c.en;setPrompt();say(G.lastTxt,undefined,go);G.locked=false;}
function bossAnswer(id,timeout){if(!G||!G.running||!G.turn)return;G.turn=false;setBtns(false);const ok=G.says?id===G.cmd.id:id===null;
 G.fb={ok,msg:ok?(G.says?'✅ '+rand(PRAISE):'✅ ¡Bien! Simon no lo dijo'):(!G.says?'❌ ¡Simon no lo dijo! Había que quedarse quieto':timeout?'⏰ ¡Tiempo! Era: '+G.cmd.en:'❌ Era: '+G.cmd.en)};
 if(id)G.P.anim={type:id,t:0};
 if(ok){G.correct++;G.earned++;G.bossHP--;G.shots.push({t:0});sfx('hit');say(G.says?rand(PRAISE):"Well done! Simon didn't say!");}
 else{G.errors++;G.laugh=70;say(G.says?(id?'Wrong move! Ha ha!':'Too slow! Ha ha!'):"Oh no! Simon didn't say!");loseHeart();}
 updHud();const gidNow=G.id;
 if(G.bossHP<=0){G.locked=true;G.defeat=0;setTimeout(()=>alive(gidNow)&&finish(true),1900);return;}
 if(G.hearts>0)setTimeout(()=>alive(gidNow)&&bossTurn(),2400);}

function loseHeart(){G.hearts--;updHud();sfx('bad');if(G.hearts<=0){G.locked=true;const id=G.id;setTimeout(()=>alive(id)&&finish(false),1000);}}

function finish(win){const L=LV();G.running=false;G.turn=false;let cr=0;
 if(win){cr=G.errors===0?3:G.errors<=2?2:1;const k=ck(G.stage);S.crowns[k]=Math.max(S.crowns[k]||0,cr);}
 S.stars+=G.earned;save();const order=['listen','spell','boss'];const nx=order[order.indexOf(G.stage)+1];const st=G.stage;
 if(win)say(rand(['Well done!','Fantastic!','You are a star!']),undefined);
 openModal(`<h2>${win?rand(['🎉 Well done!','🏆 Fantastic!','🌟 Super!']):'💔 Try again!'}</h2>
  <div class="crowns">${'👑'.repeat(cr)}<span class="dim">${'👑'.repeat(3-cr)}</span></div>
  <p>⭐ +${G.earned} &nbsp; ✅ ${G.correct} &nbsp; ❌ ${G.errors}</p>
  <div class="row"><button class="btn" id="mRep">🔁 Otra vez</button>${win&&nx?`<button class="btn pri" id="mNext">➡️ ${STAGES.find(s=>s.id===nx).en}</button>`:''}<button class="btn" id="mBack">🗺️ Mundo</button></div>`);
 $('#mRep').onclick=()=>{closeModal();startStage(st);};$('#mBack').onclick=()=>{closeModal();openWorld(worldIdx);};
 if($('#mNext'))$('#mNext').onclick=()=>{closeModal();startStage(nx);};
 if(win){for(let i=0;i<60;i++)G.parts.push({x:Math.random()*W,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:Math.random()*2,life:160,c:rand(['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93'])});}}
function quit(){if(G){G.running=false;G=null;}if('speechSynthesis' in window)speechSynthesis.cancel();openWorld(worldIdx);}
$('#quitBtn').onclick=quit;

function burst(x,y,n=20){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-.5)*9,vy:-Math.random()*8-1,life:50+Math.random()*30,c:rand(['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff8fab'])});}

/* ================== FÍSICA ================== */
const solid=p=>!p.disabled&&!p.used&&!p.gone;
function stepPlayer(dt){const P=G.P;
 if(P.tween){G.jumpQ=false;const tw=P.tween;tw.t+=dt*16.67/tw.dur;const k=Math.min(1,tw.t);
  P.x=tw.x0+(tw.x1-tw.x0)*k;P.y=tw.y0+(tw.y1-tw.y0)*k-tw.arc*Math.sin(Math.PI*k);
  if(k>=1){P.tween=null;P.vy=0;P.vx=0;tw.onEnd&&tw.onEnd();}return;}
 if(keys.left){P.vx=-6;P.face=-1;}else if(keys.right){P.vx=6;P.face=1;}else P.vx*=.75;
 if(G.jumpQ){G.jumpQ=false;if(P.onGround){P.vy=-19.5;P.onGround=false;P.standing=null;sfx('jump');}}
 P.x=Math.max(30,Math.min(W-30,P.x+P.vx*dt));
 if(P.standing){const s=P.standing;if(!solid(s)||!G.plats.includes(s)||Math.abs(P.x-s.x)>s.w/2+4){P.standing=null;P.onGround=false;}}
 if(P.standing&&P.vy>=0){P.y=P.standing.y;P.vy=0;return;}
 const prevY=P.y,prevHead=P.y-P.h;P.vy+=.8*dt;let ny=P.y+P.vy*dt;
 if(P.vy<0&&G.stage==='spell'){const nh=ny-P.h;for(const b of G.plats){if(b.used)continue;const bb=b.y+b.h;
  if(prevHead>=bb-1&&nh<=bb&&Math.abs(P.x-b.x)<b.w/2+2){ny=bb+P.h;P.vy=2;hitBlock(b);break;}}}
 if(P.vy>0){for(const p of G.plats){if(!solid(p))continue;if(prevY<=p.y+.5&&ny>=p.y&&Math.abs(P.x-p.x)<p.w/2+6){ny=p.y;P.vy=0;P.onGround=true;P.standing=p;landed(p);break;}}}
 if(ny>=GY){ny=GY;P.vy=0;P.onGround=true;P.standing=null;}else if(!P.standing)P.onGround=false;
 P.y=ny;}
function update(dt){G.time+=dt;
 if(G.stage!=='boss')stepPlayer(dt);
 else{if(G.turn&&G.timing&&G.running){G.tLeft-=dt*16.67;if(G.tLeft<=0)bossAnswer(null,true);}
  if(G.P.anim){G.P.anim.t+=dt/55;if(G.P.anim.t>=1)G.P.anim=null;}
  for(const s of G.shots)s.t+=dt/32;G.shots=G.shots.filter(s=>{if(s.t>=1){G.hit=22;burst(760,330,24);return false;}return true;});
  if(G.hit>0)G.hit-=dt;if(G.laugh>0)G.laugh-=dt;if(G.defeat!=null)G.defeat+=dt;}
 for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.3*dt;p.life-=dt;}G.parts=G.parts.filter(p=>p.life>0);
 for(const p of G.plats){if(p.shake>0)p.shake-=dt;if(p.pop!=null)p.pop+=dt;}}

  ctx.fillStyle=mode==='christmas'?'#e9f5ff':mode==='halloween'?'#c6a0e0':'#7ed957';rr(x+2,p.y+2,p.w-4,12,8);ctx.fill();

function drawBoss(t){const B=MD().boss,P=G.P,a=P.anim;let dx=0,dy=0,sq=1,flip=1,face=1,icon=null;
 if(a){const k=a.t,s=Math.sin(Math.PI*k);const c=CMDS.concat(MD().extra).find(c=>c.id===a.type);icon=c&&c.icon;
  switch(a.type){case'jump':dy=-s*110;break;case'sit':sq=.65;break;case'left':dx=-s*120;face=-1;break;case'right':dx=s*120;break;

    $('#mB').innerHTML=`<button class="btn pri big2" id="mSol">👀 Solución</button>`;
    $('#mSol').onclick=()=>{const slot=cb().querySelectorAll('#mg .c4')[hide];slot.innerHTML=picHTML(miss)+`<b>${esc(miss.w)}</b>`;slot.classList.add('ok');sfx('good');say(miss.w+'! '+noun(miss)+' is missing!');
     $('#mB').innerHTML=`<button class="btn pri big2" id="mNext">➡️ Otra ronda</button>`;$('#mNext').onclick=newRound;};},3200);};}
 newRound();}

/* --- 4. Simon Says (toda la clase) --- */
function gSimon(){const B=MD().boss,cmds=(S.level==='inf'?SCMD.slice(0,10):SCMD).concat(SXTRA[mode]||[]);
 const SP=[['🐢 Lento',7500],['🚶 Normal',5500],['🐇 Rápido',4000]];let sp={inf:0,c12:0,c34:1,c56:2}[S.level],trick=S.level!=='inf',showTxt=S.level!=='c56',running=false,count=0;
 cb().innerHTML=`<div class="simon"><div class="sbub" id="sB">${B.name}: let's play Simon Says!</div><div class="srow"><div class="sboss">${B.e}</div><div class="sicon" id="sI">${capiSVG()}</div></div></div>
  <div class="row"><button class="btn pri big2" id="sGo">▶ Empezar</button><button class="btn" id="sSpd"></button><button class="btn" id="sTrk"></button><button class="btn" id="sTxt"></button><div class="pill">🔁 <span id="sC">0</span></div></div>`;
 const lab=()=>{$('#sSpd').textContent=SP[sp][0];$('#sTrk').textContent=trick?'😈 Con trampas':'🙂 Sin trampas';$('#sTxt').textContent=showTxt?'👁️ Con texto':'🙈 Sin texto';};lab();
 $('#sSpd').onclick=()=>{sp=(sp+1)%3;lab();};$('#sTrk').onclick=()=>{trick=!trick;lab();};$('#sTxt').onclick=()=>{showTxt=!showTxt;lab();};
 function tick(){if(!running)return;const c=rand(cmds),says=!trick||Math.random()<.7,ms=SP[sp][1];count++;$('#sC').textContent=count;
  const b=$('#sB');b.className='sbub';b.innerHTML=showTxt?(says?'<small>Simon says:</small> ':'')+c[0]:'👂 Listen!';$('#sI').textContent=showTxt?c[1]:'❔';
  say((says?'Simon says, ':'')+c[0]);
  if(!says){clT(()=>{if(!running)return;b.className='sbub bad';b.innerHTML="😱 Simon didn't say!<small>¿Quién se ha movido?</small>";$('#sI').textContent='🙅';sfx('bad');say("Simon didn't say!");},ms*.7);clT(tick,ms*.7+3200);}
  else{clT(()=>{if(running&&!showTxt)$('#sI').textContent=c[1];},ms*.6);clT(tick,ms);}}
 $('#sGo').onclick=function(){running=!running;this.textContent=running?'⏸ Pausa':'▶ Seguir';if(running)tick();else{CL.timers.forEach(clearTimeout);CL.timers=[];speechSynthesis&&speechSynthesis.cancel();}};}

/* --- 5. Ruleta --- */
function gWheel(){S.scores=S.scores||{};let rot=0,pool=[],spinning=false;const words=cWords();
 const names=()=>(S.students||[]).filter(Boolean);
 const COLS=['#fca5a5','#93c5fd','#86efac','#fde047','#c4b5fd','#fdba74','#f9a8d4','#67e8f9'];
 function setup(){cb().innerHTML=`<div class="panel csetup"><h2>🎡 Ruleta</h2><label for="wN"><b>Nombres del alumnado (uno por línea)</b></label><textarea id="wN" rows="10">${esc(names().join('\n'))}</textarea><p id="wMsg"></p><button class="btn pri big2" id="wOk">▶ Usar esta lista</button></div>`;
  $('#wOk').onclick=()=>{const ns=[...new Set($('#wN').value.split('\n').map(x=>x.trim()).filter(Boolean))];if(ns.length<2){$('#wMsg').textContent='⚠️ Escribe al menos 2 nombres.';return;}S.students=ns;save();pool=[];play();};}
 function drawWheel(){const c=$('#wc');if(!c)return;const dpr=Math.min(2,devicePixelRatio||1),R=230;c.width=460*dpr;c.height=460*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const ns=names(),n=ns.length,seg=Math.PI*2/n;x.clearRect(0,0,460,460);
  for(let i=0;i<n;i++){const a0=rot+i*seg;x.beginPath();x.moveTo(R,R);x.arc(R,R,R-6,a0,a0+seg);x.closePath();x.fillStyle=COLS[i%COLS.length];x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
   x.save();x.translate(R,R);x.rotate(a0+seg/2);x.textAlign='right';x.textBaseline='middle';x.fillStyle='#24324a';x.font=`800 ${n>20?14:n>12?18:22}px 'Baloo 2',sans-serif`;
   const nm=ns[i].length>14?ns[i].slice(0,13)+'…':ns[i];x.fillText(nm,R-20,0);x.restore();}
  x.beginPath();x.arc(R,R,34,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.font=`36px ${EF}`;x.textAlign='center';x.textBaseline='middle';x.fillText('⭐',R,R+2);}
 function wait(){$('#wS').innerHTML=`<div class="ptxt">🎡 ¿A quién le toca?</div>${capiSVG()}`;}
 function play(){if(names().length<2)return setup();
  cb().innerHTML=`<div class="wheelwrap"><div class="wcol"><div class="wptr">▼</div><canvas id="wc"></canvas></div><div class="wside" id="wS"></div></div>
   <div class="row"><button class="btn pri big2" id="wSpin">🎡 Girar</button><button class="btn big2" id="wRank">🏆 Ranking</button><button class="btn" id="wEdit">✏️ Lista</button></div>`;
  drawWheel();wait();$('#wEdit').onclick=setup;$('#wRank').onclick=rank;$('#wSpin').onclick=spin;}
 function spin(){if(spinning)return;const ns=names(),n=ns.length,seg=Math.PI*2/n;if(!pool.length)pool=shuffle(ns.map((_,i)=>i));const i=pool.pop();
  const target=-Math.PI/2-(i+.5)*seg,start=rot,delta=(((target-start)%(Math.PI*2))+Math.PI*2)%(Math.PI*2),final=start+Math.PI*10+delta,t0=performance.now(),dur=4200;
  spinning=true;wait();let lastSeg=-1;
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);rot=start+(final-start)*e;drawWheel();const sg=Math.floor(rot/seg);if(sg!==lastSeg){lastSeg=sg;tone(700,.04,'square',.04);}
   if(k<1)CL.raf=requestAnimationFrame(step);else{rot=final%(Math.PI*2);spinning=false;challenge(ns[i]);}};CL.raf=requestAnimationFrame(step);}
 function challenge(name){const w=rand(words);sfx('coin');
  $('#wS').innerHTML=`<div class="tturn" style="background:var(--acc)">${esc(name)}</div><div class="ptxt">🗣️ What's this?</div><div class="c4 one" style="--cc:var(--acc)">${picHTML(w)}<b class="ans" hidden>${esc(w.w)}</b></div><div class="row" id="wB"><button class="btn pri big2" id="wSol">👀 Solución</button></div>`;
  say("What's this?");
  $('#wSol').onclick=()=>{$('#wS .ans').hidden=false;$('#wS .c4').classList.add('ok');say(w.w+'!');
   $('#wB').innerHTML=`<button class="btn big2 okb" id="wOk2">✅ +1 ⭐</button><button class="btn big2 kob" id="wKo">❌</button>`;
   $('#wOk2').onclick=()=>{S.scores[name]=(S.scores[name]||0)+1;save();sfx('good');say(rand(PRAISE));wait();};$('#wKo').onclick=()=>{sfx('bad');wait();};};}
 function rank(){const ns=names(),rk=ns.map(n=>[n,S.scores[n]||0]).sort((a,b)=>b[1]-a[1]);
  openModal(`<h2>🏆 Ranking</h2><div class="rank">${rk.map((r,i)=>`<div>${i<3?['🥇','🥈','🥉'][i]:(i+1)+'.º'} ${esc(r[0])} · ⭐ ${r[1]}</div>`).join('')}</div><div class="row"><button class="btn pri" id="rkX">Cerrar</button><button class="btn" id="rkR">🔄 Poner a cero</button></div>`);
  $('#rkX').onclick=closeModal;$('#rkR').onclick=()=>{S.scores={};save();rank();};}
 names().length>=2?play():setup();}

/* ================== TIENDA Y AJUSTES ================== */
function openShop(){openModal(`<h2>🛍️ Tienda de Capitulín</h2><p>⭐ ${S.stars} estrellas</p><div class="shop" id="shopG"></div>
 <p style="font-size:1rem;color:var(--muted)">En Halloween y Christmas Capitulín lleva su disfraz.</p><button class="btn pri" id="shopX">Cerrar</button><br><button class="link" id="resetB">Borrar progreso</button>`);
 const g=$('#shopG');HATS.forEach(h=>{const own=S.hats.includes(h.id);const b=document.createElement('button');b.className=S.hat===h.id?'on':'';
  b.innerHTML=`<span>${h.e}</span>${h.n}<br>${own?(S.hat===h.id?'✅ Puesto':'Ponerse'):'⭐ '+h.p}`;
  b.onclick=()=>{if(own){S.hat=h.id;}else if(S.stars>=h.p){S.stars-=h.p;S.hats.push(h.id);S.hat=h.id;sfx('coin');}else{sfx('bad');return;}save();refreshStars();openShop();};g.appendChild(b);});
 $('#shopX').onclick=closeModal;
 $('#resetB').onclick=()=>{openModal(`<h2>¿Borrar todo?</h2><p>Se perderán estrellas, coronas y gorros.</p><div class="row"><button class="btn" id="rNo">Cancelar</button><button class="btn pri" id="rYes">Borrar</button></div>`);
  $('#rNo').onclick=openShop;$('#rYes').onclick=()=>{const lv=S.level;S=defS();S.level=lv;save();closeModal();goHome();};};}
$('#shopBtn').onclick=openShop;
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();$('#soundBtn').textContent=S.sound?'🔊':'🔇';};
$('#fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};

goHome();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
